name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Tool versions come from mise.toml, so CI runs what you run locally. Each job
# installs only the tools it needs.
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5
        with:
          install_args: foundry
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  # Separate job so a flaky public RPC doesn't hide the unit test result.
  # Set the MAINNET_RPC_URL repo secret to use a private endpoint instead.
  fork:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5
        with:
          install_args: foundry
      - run: forge test --mc Fork -vvv

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          # ord for the cross-check in test/ord.test.js
          install_args: node pnpm github:ordinals/ord
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build

  # Both suites trust fixtures/vectors.json, so it must match its generator.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          install_args: python
      - run: python scripts/gen-vectors.py
      - run: git diff --exit-code fixtures/

  # Publishes web/ to teleburn.dev (see web/wrangler.jsonc) after the tests
  # pass on main. Not gated on the fork job: that tests the contract against a
  # public RPC, and neither affects the site.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contracts, web, fixtures]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://teleburn.dev
    concurrency:
      group: deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec wrangler deploy
